<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Chat</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }
    .message {
      margin: 5px 0;
    }
    .user { color: blue; }
    .bot { color: green; }
    #controls {
      display: flex;
      border-top: 1px solid #ccc;
      padding: 5px;
    }
    #userInput {
      flex: 1;
      padding: 5px;
      font-size: 14px;
    }
    button {
      margin-left: 5px;
      padding: 5px 10px;
      font-size: 14px;
      cursor: pointer;
    }
    #micBtn.listening {
      background: red;
      color: white;
    }
  </style>
</head>
<body>

  <div id="chat"></div>

  <div id="controls">
    <input type="text" id="userInput" placeholder="Type or speak..." />
    <button id="micBtn">🎤</button>
    <button id="sendBtn">Send</button>
    <button id="clearBtn">Clear</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const micBtn = document.getElementById("micBtn");

    let isListening = false;
    let recognition;

    // --- Speech Recognition Setup ---
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.lang = 'en-US';
      recognition.interimResults = true;

      recognition.onresult = function(event) {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            final += transcript + ' ';
          } else {
            interim += transcript;
          }
        }
        userInput.value = final + interim;
      };

      recognition.onend = function() {
        if (isListening) recognition.start(); // auto-restart if still listening
      };
    }

    // ----- Gemini Setup ----- //
    async function getGeminiResponse(prompt) {
      const apiKey = "AIzaSyBsxx6zFz7l-UJVTHLpMG3T-vOCLC04wgw"; 
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=" + apiKey, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text: prompt }] }]
        })
      });

      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || "⚠️ No response";
    }

    // --- Add Message to Chat ---
    function addMessage(sender, text) {
      const div = document.createElement("div");
      div.classList.add("message", sender);
      div.textContent = sender.toUpperCase() + ": " + text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // --- Send Button ---
    sendBtn.addEventListener("click", async () => {   // ✅ FIX: async added
      const text = userInput.value.trim();
      if (!text) return;
      addMessage("user", text);
      userInput.value = "";
      const response = await getGeminiResponse(text);
      addMessage("bot", response);
    });

    // --- Clear Chat ---
    clearBtn.addEventListener("click", () => {
      chat.innerHTML = "";
    });

    // --- Mic Button ---
    micBtn.addEventListener("click", () => {
      if (!isListening) {
        recognition.start();
        isListening = true;
        micBtn.classList.add("listening");
      } else {
        recognition.stop();
        isListening = false;
        micBtn.classList.remove("listening");
      }
    });
  </script>
</body>
</html>
