<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant with Ollama</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Voice Assistant with Ollama</h1>
        
        <div class="settings-panel">
            <div class="form-group">
                <label for="ollamaUrl">Ollama URL:</label>
                <input type="text" id="ollamaUrl" value="http://localhost:11434/api/generate">
            </div>
            
            <div class="form-group">
                <label for="modelSelect">Model:</label>
                <select id="modelSelect">
                    <option value="llama2">llama2</option>
                    <option value="mistral">mistral</option>
                    <option value="gemma">gemma</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="devField">Development Field:</label>
                <select id="devField">
                    <option value="web">Web Development</option>
                    <option value="mobile">Mobile Development</option>
                    <option value="ai">AI/ML</option>
                    <option value="data">Data Science</option>
                    <option value="devops">DevOps</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="workExp">Work Experience:</label>
                <select id="workExp">
                    <option value="entry">0-2 years (Entry Level)</option>
                    <option value="mid">3-5 years (Mid Level)</option>
                    <option value="senior">5+ years (Senior Level)</option>
                </select>
            </div>
        </div>
        
        <button id="listenButton" class="btn">Start Listening</button>
        <div id="status" class="status">Press the button and speak</div>
        
        <div class="output-section">
            <h2>Your Question:</h2>
            <div id="transcript" class="output-box"></div>
            
            <h2>Ollama Response:</h2>
            <div id="response" class="output-box"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
